<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pavement Café Planning Tools</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f6f8;
      color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 520px;
      width: 100%;
      background: #ffffff;
      padding: 36px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 1.6rem;
    }

    p {
      color: #475569;
      margin-bottom: 28px;
    }

    .card-link {
      display: block;
      text-decoration: none;
      background: #0f172a;
      color: #ffffff;
      padding: 16px 20px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-weight: 600;
      transition: background 0.2s;
    }

    .card-link:hover {
      background: #334155;
    }

    .card-link span {
      display: block;
      font-size: 0.85rem;
      font-weight: 400;
      color: #cbd5e1;
      margin-top: 4px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Pavement Café Planning Tools</h1>
    <p>Choose a tool below to get started:</p>

    <a class="card-link" href="https://pc-planner.github.io/" target="_blank" rel="noopener noreferrer">
      Pavement Café Plan Builder
      <span>1:50 Scale Architectural Site Plan &amp; A3 PDF Export Tool</span>
    </a>

    <a class="card-link" href="https://pavement-cafe-tool.streamlit.app/" target="_blank" rel="noopener noreferrer">
      Pavement Café Streamlit App
      <span>Interactive Pavement Café Tool</span>
    </a>
  </div>
</body>

</html>
